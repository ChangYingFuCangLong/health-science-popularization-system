<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>健康科普助手</title>
    <script>
      // 挂载前设定主题，避免暗色用户看到白屏闪烁。
      // 默认暗色「夜间诊室」；用户手动切换后记入 localStorage。
      // 旧版本键为 qian-theme，首次加载时迁移到 health-rag-theme。
      try {
        var t = localStorage.getItem('health-rag-theme')
        if (t === null) {
          t = localStorage.getItem('qian-theme')
          if (t !== null) {
            localStorage.setItem('health-rag-theme', t)
            localStorage.removeItem('qian-theme')
          }
        }
        if (t !== 'light') document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
